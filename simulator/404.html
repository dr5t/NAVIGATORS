<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Navigators</title>
    <meta name="description" content="The location you are looking for is not available.">
    
    
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-dark, #0B0F19);
            color: var(--text-primary, #F9FAFB);
            font-family: var(--font-main, 'Inter', -apple-system, BlinkMacSystemFont, sans-serif);
            text-align: center;
            box-sizing: border-box;
        }

        .container-404 {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 460px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .badge-404 {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.85rem;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #F59E0B;
            font-size: 0.85rem;
            font-family: var(--font-mono, monospace);
            font-weight: 600;
            border-radius: 9999px;
            margin-bottom: 1.5rem;
            letter-spacing: 0.05em;
        }

        h1 {
            font-size: var(--type-display-size, 1.75rem);
            font-weight: var(--type-display-weight, 700);
            color: #F9FAFB;
            margin: 0 0 0.75rem 0;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }


        p {
            color: #9CA3AF;
            font-size: 1.05rem;
            line-height: 1.5;
            margin: 0 0 2rem 0;
        }

        .btn-navigate {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: #10B981;
            color: #0B0F19;
            font-weight: 600;
            font-size: 0.95rem;
            padding: 0.85rem 1.75rem;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
        }

        .btn-navigate:hover {
            background: #34D399;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.35);
        }

        footer {
            margin-top: 2.5rem;
            font-size: 0.8rem;
            color: #6B7280;
        }
    </style>
</head>
<body>
    <div class="container-404">
        <div class="badge-404">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            ERROR 404
        </div>
        <h1>Page not found</h1>
        <p>The location you're looking for isn't available.</p>
        <a href="./" class="btn-navigate">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="3 11 22 2 13 21 11 13 3 11"></polygon>
            </svg>
            Return to Navigate
        </a>
    </div>

    <footer class="compact-footer" style="max-width: 600px; margin: 2rem auto 0; border: 1px solid rgba(255,255,255,0.08); background: rgba(17,24,39,0.7);">
        <div class="footer-brand">Navigators</div>
        <nav class="footer-links-primary">
            <a href="./">Navigate</a>
            <a href="./#explore">Explore</a>
            <a href="./#contribute">Contribute</a>
            <a href="./#lab">Navigator Lab</a>
            <a href="contact.html">Support</a>
        </nav>
        <nav class="footer-links-secondary">
            <a href="privacy.html">Privacy</a>
            <a href="terms.html">Terms</a>
            <a href="cookies.html">Cookies</a>
        </nav>
        <div class="footer-copy">Developed by Navigators</div>
    </footer>
</body>
</html>
